name: Wiki doctor

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Run wiki doctor
        run: python -m wiki_api.doctor --format github
      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m wiki_api.doctor --format github --check-external-links
