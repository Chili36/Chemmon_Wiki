name: Tests and wiki health

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/health_check.py
      - run: pytest -q
