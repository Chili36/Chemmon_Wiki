<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemMon Wiki</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #fafafa;
    --sidebar-bg: #fff;
    --sidebar-border: #e2e2e2;
    --text: #1a1a1a;
    --text-muted: #666;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --code-bg: #f1f5f9;
    --code-border: #e2e8f0;
    --table-border: #d1d5db;
    --table-stripe: #f9fafb;
    --badge-bg: #e0e7ff;
    --badge-text: #3730a3;
    --meta-bg: #f8fafc;
    --meta-border: #e2e8f0;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  aside {
    width: 280px;
    min-width: 280px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 16px 12px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  .sidebar-header h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .sidebar-header p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .nav-section {
    padding: 12px 16px 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
  }

  nav {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 20px;
  }

  nav a {
    display: block;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    border-left: 3px solid transparent;
    transition: all 0.15s;
  }

  nav a:hover { background: var(--table-stripe); }
  nav a.active {
    background: var(--badge-bg);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 48px;
    max-width: 900px;
  }

  .meta-bar {
    background: var(--meta-bg);
    border: 1px solid var(--meta-border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }

  .meta-bar .label { font-weight: 600; color: var(--text); }

  .related-links { display: flex; flex-wrap: wrap; gap: 6px; }

  .related-link {
    display: inline-block;
    padding: 2px 8px;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 4px;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s;
  }

  .related-link:hover { background: #c7d2fe; }

  .content h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.02em; }
  .content h2 { font-size: 20px; font-weight: 600; margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--sidebar-border); }
  .content h3 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
  .content p { line-height: 1.7; margin-bottom: 12px; }
  .content ul, .content ol { margin: 8px 0 16px 20px; line-height: 1.7; }
  .content li { margin-bottom: 6px; }
  .content li ul { margin-top: 4px; margin-bottom: 4px; }

  .content code {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  }

  .content pre {
    background: var(--code-bg);
    border: 1px solid var(--code-border);
    border-radius: var(--radius);
    padding: 14px 16px;
    overflow-x: auto;
    margin: 12px 0 16px;
  }

  .content pre code {
    border: none;
    padding: 0;
    background: none;
    font-size: 13px;
  }

  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0 20px;
    font-size: 14px;
  }

  .content th, .content td {
    border: 1px solid var(--table-border);
    padding: 8px 12px;
    text-align: left;
  }

  .content th {
    background: var(--table-stripe);
    font-weight: 600;
  }

  .content tr:nth-child(even) { background: var(--table-stripe); }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .controls { padding: 12px 16px; display: grid; gap: 8px; }
  .controls label { font-size: 12px; color: var(--text-muted); }
  .controls input, .controls select { width: 100%; padding: 8px; border: 1px solid var(--sidebar-border); border-radius: 4px; font: inherit; font-size: 13px; background: #fff; }
  #search-status { font-size: 12px; color: var(--text-muted); }
  #backlinks { margin-top: 32px; border-top: 1px solid var(--sidebar-border); padding-top: 16px; }
  #backlinks h2 { font-size: 16px; margin-bottom: 8px; }
  #backlinks a { display: block; margin: 8px 0; color: var(--accent); }
  .content { overflow-wrap: anywhere; }
  .content table { display: block; overflow-x: auto; overflow-wrap: normal; }
  main { min-width: 0; }
  @media (max-width: 640px) {
    body { display: block; height: auto; overflow: auto; }
    aside { width: 100%; min-width: 0; max-height: 42vh; border-bottom: 1px solid var(--sidebar-border); }
    main { padding: 24px 20px; overflow: visible; }
  }
</style>
</head>
<body>

<aside>
  <div class="sidebar-header">
    <h1>ChemMon Wiki</h1>
    <p>Knowledge base viewer</p>
  </div>
  <div class="controls">
    <label for="find-input">Search guidance</label>
    <input id="find-input" type="search" placeholder="Field, rule or topic…">
    <label for="domain-filter">Domain</label>
    <select id="domain-filter"><option value="">All domains</option></select>
    <p id="search-status" role="status" aria-live="polite"></p>
  </div>
  <nav id="nav" aria-label="Wiki pages"></nav>
</aside>

<main>
  <div id="meta" class="meta-bar" style="display:none"></div>
  <div id="content" class="content">
    <div class="loading">Loading wiki&hellip;</div>
  </div>
  <section id="backlinks" aria-label="Pages linking here" hidden></section>
</main>

<script>
const sectionForType = {
  orientation: "Orientation", overview: "Overview", hub: "Topic guides",
  "domain-guide": "Domain guides", "rule-reference": "Business rules", reference: "Reference"
};
const domainLabels = {all: "Shared guidance", "cross-cutting": "Cross-cutting", vmpr: "VMPR", pesticide: "Pesticides", contaminant: "Contaminants", additives: "Additives and flavourings", "baby-food": "Baby food"};
let catalog = [];
let searchRevision = 0;
let pageRevision = 0;
let activePage = "";

let pageCache = {};
let pageTitles = {};

function sanitize(html) {
  return DOMPurify.sanitize(html);
}

async function init() {
  try {
    const res = await fetch("/wiki/pages");
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    catalog = data.pages;
    for (const p of catalog) {
      pageTitles[p.page_name] = p.title;
    }
    pageTitles["index.md"] = "Wiki Index";
    pageTitles["log.md"] = "Wiki Log";
    const select = document.getElementById("domain-filter");
    for (const domain of [...new Set(catalog.filter(p => p.type !== "orientation").map(p => p.domain))].sort()) {
      const option = document.createElement("option");
      option.value = domain;
      option.textContent = domainLabels[domain] || domain;
      select.appendChild(option);
    }
  } catch(e) {
    document.getElementById("search-status").textContent = "Could not load navigation. Reload to try again.";
  }
  buildNav(catalog);
  let searchTimer;
  document.getElementById("find-input").addEventListener("input", () => {
    ++searchRevision;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(refreshNav, 200);
  });
  document.getElementById("domain-filter").addEventListener("change", refreshNav);
  const hash = location.hash.replace("#", "");
  loadPage(hash || "index.md");
}

async function refreshNav() {
  const revision = ++searchRevision;
  const query = document.getElementById("find-input").value.trim();
  const domain = document.getElementById("domain-filter").value;
  const status = document.getElementById("search-status");
  if (!query) {
    const pages = catalog.filter(p => !domain || (p.type !== "orientation" && p.domain === domain));
    buildNav(pages);
    status.textContent = domain ? pages.length + " pages" : "";
    return;
  }
  status.textContent = "Searching…";
  try {
    const params = new URLSearchParams({ q: query, limit: "100" });
    if (domain) params.set("domain", domain);
    const response = await fetch("/wiki/search?" + params);
    if (!response.ok) throw new Error(response.statusText);
    const result = await response.json();
    if (revision !== searchRevision) return;
    buildNav(result.pages, true);
    status.textContent = result.count ? result.count + " matching pages" : "No matching pages. Try a shorter term or another domain.";
  } catch (error) {
    if (revision === searchRevision) status.textContent = "Search unavailable. Try again.";
  }
}

function buildNav(items, searchResults = false) {
  const sections = {};
  for (const page of items) {
    const section = searchResults ? "Search results" : sectionForType[page.type] || "Reference";
    (sections[section] ||= []).push(page.page_name);
  }
  const nav = document.getElementById("nav");
  while (nav.firstChild) nav.removeChild(nav.firstChild);
  for (const [section, pages] of Object.entries(sections)) {
    const header = document.createElement("div");
    header.className = "nav-section";
    header.textContent = section;
    nav.appendChild(header);
    for (const page of pages) {
      const a = document.createElement("a");
      a.href = "#" + page;
      a.textContent = pageTitles[page] || page.replace(".md", "").replace(/-/g, " ");
      a.dataset.page = page;
      a.classList.toggle("active", page === activePage);
      a.addEventListener("click", function(e) {
        e.preventDefault();
        loadPage(this.dataset.page);
      });
      nav.appendChild(a);
    }
  }
}

async function loadPage(pageName) {
  activePage = pageName;
  const revision = ++pageRevision;
  if (location.hash !== "#" + pageName) history.pushState(null, "", "#" + pageName);
  document.getElementById("backlinks").hidden = true;
  document.querySelectorAll("nav a").forEach(function(a) {
    a.classList.toggle("active", a.dataset.page === pageName);
  });

  const contentEl = document.getElementById("content");
  const metaEl = document.getElementById("meta");

  if (pageCache[pageName]) {
    renderPage(pageCache[pageName]);
    loadBacklinks(pageName, revision);
    return;
  }

  contentEl.textContent = "";
  const loadingDiv = document.createElement("div");
  loadingDiv.className = "loading";
  loadingDiv.textContent = "Loading\u2026";
  contentEl.appendChild(loadingDiv);
  metaEl.style.display = "none";

  try {
    const res = await fetch("/wiki/pages/" + encodeURIComponent(pageName));
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    pageCache[pageName] = data;
    if (revision !== pageRevision) return;
    renderPage(data);
    loadBacklinks(pageName, revision);
  } catch(e) {
    if (revision === pageRevision) contentEl.textContent = "Failed to load " + pageName + ": " + e.message;
  }
}

async function loadBacklinks(pageName, revision) {
  const section = document.getElementById("backlinks");
  section.replaceChildren();
  try {
    const response = await fetch("/wiki/pages/" + encodeURIComponent(pageName) + "/backlinks");
    if (!response.ok) return;
    const data = await response.json();
    if (revision !== pageRevision || !data.backlinks.length) return;
    const heading = document.createElement("h2");
    heading.textContent = "Pages linking here";
    section.appendChild(heading);
    for (const name of data.backlinks) {
      const link = document.createElement("a");
      link.href = "#" + name;
      link.textContent = pageTitles[name] || name;
      section.appendChild(link);
    }
    section.hidden = false;
  } catch (_) { /* The page remains readable when backlinks are unavailable. */ }
}

function renderPage(data) {
  const contentEl = document.getElementById("content");
  const metaEl = document.getElementById("meta");

  let md = data.content || "";
  // strip YAML frontmatter
  if (md.startsWith("---")) {
    const end = md.indexOf("---", 3);
    if (end > 0) md = md.substring(end + 3).trim();
  }
  // NOTE: Content is sanitized via DOMPurify before DOM insertion
  const rendered = sanitize(marked.parse(md));
  contentEl.textContent = "";
  const wrapper = document.createElement("div");
  wrapper.innerHTML = rendered;
  contentEl.appendChild(wrapper);

  // Convert wiki syntax in prose, leaving code examples and existing links alone.
  const walker = document.createTreeWalker(wrapper, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) {
    if (!walker.currentNode.parentElement.closest("code, pre, a")) nodes.push(walker.currentNode);
  }
  for (const node of nodes) {
    const pattern = /\[\[([a-zA-Z0-9_-]+)(?:\|([^\]]+))?\]\]/g;
    const matches = [...node.textContent.matchAll(pattern)];
    if (!matches.length) continue;
    const fragment = document.createDocumentFragment();
    let offset = 0;
    for (const match of matches) {
      fragment.appendChild(document.createTextNode(node.textContent.slice(offset, match.index)));
      const link = document.createElement("a");
      link.href = "#" + match[1] + ".md";
      link.textContent = match[2] || pageTitles[match[1] + ".md"] || match[1];
      fragment.appendChild(link);
      offset = match.index + match[0].length;
    }
    fragment.appendChild(document.createTextNode(node.textContent.slice(offset)));
    node.replaceWith(fragment);
  }
  contentEl.querySelectorAll("a").forEach(function(a) {
    const href = a.getAttribute("href") || "";
    if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("//")) return;
    const path = href.split("#")[0];
    const target = path.split("/").pop();
    if (target && pageTitles[target]) a.href = "#" + target;
  });

  // build meta bar
  const hasSources = data.sources && data.sources.length > 0;
  const hasRelated = data.related && data.related.length > 0;

  if (hasSources || hasRelated || data.last_updated) {
    while (metaEl.firstChild) metaEl.removeChild(metaEl.firstChild);

    if (data.last_updated) {
      const updated = document.createElement("div");
      updated.textContent = "Updated: " + data.last_updated;
      metaEl.appendChild(updated);
    }
    if (hasSources) {
      const srcDiv = document.createElement("div");
      const srcLabel = document.createElement("span");
      srcLabel.className = "label";
      srcLabel.textContent = "Sources: ";
      srcDiv.appendChild(srcLabel);
      srcDiv.appendChild(document.createTextNode(data.sources.join("; ") + (data.source_pages && data.source_pages.length ? " — " + data.source_pages.join("; ") : "")));
      metaEl.appendChild(srcDiv);
    }

    if (hasRelated) {
      const relDiv = document.createElement("div");
      const relLabel = document.createElement("span");
      relLabel.className = "label";
      relLabel.textContent = "Related: ";
      relDiv.appendChild(relLabel);

      const linksDiv = document.createElement("div");
      linksDiv.className = "related-links";
      data.related.forEach(function(r) {
        const match = r.match(/\[\[([^|\]]+)(?:\|[^\]]+)?\]\]/);
        if (!match) return;
        const name = match[1] + ".md";
        const title = pageTitles[name] || name.replace(".md", "").replace(/-/g, " ");
        const span = document.createElement("a");
        span.href = "#" + name;
        span.className = "related-link";
        span.textContent = title;

        linksDiv.appendChild(span);
      });
      relDiv.appendChild(linksDiv);
      metaEl.appendChild(relDiv);
    }

    metaEl.style.display = "flex";
  } else {
    metaEl.style.display = "none";
  }

  document.querySelector("main").scrollTop = 0;
}

window.addEventListener("hashchange", function() {
  const page = location.hash.replace("#", "");
  if (page) loadPage(page);
});

init();
</script>
</body>
</html>
